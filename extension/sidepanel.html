<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Déjà</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; font-size: 14px; }
  body { margin: 0; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  .muted { opacity: .65; font-size: 12px; }
  .card { border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 10px; padding: 10px 12px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 70px; border-radius: 8px; padding: 8px; font: inherit; }
  button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); background: transparent; cursor: pointer; }
  button.primary { background: #4f46e5; color: white; border-color: #4f46e5; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .addr { font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, currentColor 12%, transparent); }
  .badge.hit { background: #16a34a22; color: #16a34a; }
  .badge.new { background: #4f46e522; color: #6366f1; }
  #result { white-space: pre-wrap; line-height: 1.45; }
  #status { min-height: 1.2em; }
  details summary { cursor: pointer; }
  input { font: inherit; padding: 6px 8px; border-radius: 6px; width: 100%; box-sizing: border-box; }
  .err { color: #dc2626; }
</style>
</head>
<body>
  <div>
    <h1>Déjà</h1>
    <div class="muted">La bourse du raisonnement</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between">
      <strong>Mon wallet</strong>
      <span id="cluster" class="badge">…</span>
    </div>
    <div id="address" class="addr">…</div>
    <div class="row muted" style="margin-top:6px">
      <span id="balSol">SOL : …</span> · <span id="balUsdc">USDC : …</span>
      <button id="refresh" style="padding:2px 8px;font-size:11px">actualiser</button>
    </div>
  </div>

  <textarea id="task" placeholder="Que veux-tu que l'agent fasse avec cette page ? Ex. : résume-la en 5 points"></textarea>
  <div class="row">
    <button id="go" class="primary">Demander</button>
    <span id="status" class="muted"></span>
  </div>

  <div id="quote" class="card" hidden>
    <div class="row"><span class="badge hit">Déjà pensé</span> <span id="reuse" class="muted"></span></div>
    <p id="preview" class="muted" style="margin:8px 0"></p>
    <div class="row">
      <button id="buy" class="primary">Acheter pour <span id="price"></span> USDC</button>
      <span class="muted">au lieu de le refaire</span>
    </div>
  </div>

  <div id="resultCard" class="card" hidden>
    <div class="row"><span id="resultBadge" class="badge"></span></div>
    <div id="result"></div>
  </div>

  <details>
    <summary class="muted">Réglages</summary>
    <label class="muted">Adresse du serveur Déjà</label>
    <input id="server" />
    <div class="row" style="margin-top:6px">
      <button id="saveServer">Enregistrer</button>
      <button id="exportKey">Exporter ma clé secrète</button>
    </div>
    <p class="muted">Réseau de test : l'argent n'est pas réel. Obtiens des SOL sur faucet.solana.com et des USDC sur faucet.circle.com.</p>
  </details>

  <script src="dist/sidepanel.js"></script>
</body>
</html>
