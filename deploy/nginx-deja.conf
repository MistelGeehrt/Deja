# Site nginx pour Déjà (quand nginx sert déjà d'autres sites sur le VPS).
# Copier dans /etc/nginx/sites-available/deja, activer, puis : certbot --nginx -d deja.mistelgeehrt.com --redirect
server {
    listen 80;
    listen [::]:80;
    server_name deja.mistelgeehrt.com;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
